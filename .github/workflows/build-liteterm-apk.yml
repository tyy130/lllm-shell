name: Build LiteTerm APK

on:
  push:
    branches:
      - build/liteterm-v0.0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Unpack LiteTerm
        run: unzip -q liteterm.zip
      - name: Build debug APK
        working-directory: android-lite-terminal
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-lite-terminal/app/build/outputs/apk/debug/app-debug.apk LiteTerm-v0.0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LiteTerm-v0.0.1-debug-apk
          path: LiteTerm-v0.0.1-debug.apk
          if-no-files-found: error
